<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Global Population — 1 Dot = 1M People</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
            rel="stylesheet"
        />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                /*background: #07090a;*/
                background: linear-gradient(
                    180deg,
                    rgba(242, 242, 242, 1) 0%,
                    rgba(222, 222, 222, 1) 100%
                );

                overflow: hidden;
                font-family: "DM Mono", ui-monospace, monospace;
            }
            .font-sans {
                font-family: "DM Sans", sans-serif;
                font-weight: 400;
                font-style: normal;
            }
            canvas {
                display: block;
            }
            #overlay {
                position: fixed;
                top: 16px;
                left: 16px;
                color: #222;
                max-width: 280px;
                pointer-events: none;
            }
            #overlay h1 {
                margin: 0 0 6px;
                font-size: 1rem;
                font-weight: 500;
                letter-spacing: 0.02em;
            }
            #overlay p {
                margin: 0;
                color: #222;
                font-size: 0.8rem;
                line-height: 1.5;
            }
            #yearControl {
                margin-top: 16px;
                pointer-events: auto;
            }
            #yearControl .year-value {
                color: #222;
                font-size: 3rem;
                font-weight: 500;
            }
            #yearSlider {
                width: 280px;
                accent-color: #222;
                background: transparent;
            }
            #tooltip {
                position: fixed;
                transform: translate(-50%, -130%);
                /*background: #0d1411;*/
                /*background: #f2f2f2;*/
                /*border: 1px solid #fff;*/
                color: #222;
                padding: 6px 10px;
                font-size: 0.8rem;
                border-radius: 2px;
                pointer-events: none;
                white-space: nowrap;
            }
            #tooltip[hidden] {
                display: none;
            }
            .glass {
                background: rgba(255, 255, 255, 0.1);

                /* The core frosted glass blur effect */
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px); /* Safari support */

                /* Crisp border simulating light catching the edge */
                border: 1px solid rgba(255, 255, 255, 0.25);

                /* Smooth curves and depth shadow */
                /*border-radius: 16px;*/
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
            }
            .all-caps {
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <div id="overlay">
            <h1 class="all-caps">Global Population</h1>
            <p id="status">Loading population data…</p>
            <div id="yearControl" hidden>
                <div class="year-value">
                    <span id="yearValue" class="font-sans"></span>
                </div>
                <input id="yearSlider" type="range" autocomplete="off" />
            </div>
        </div>
        <div id="tooltip" class="glass" hidden></div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
                }
            }
        </script>

        <script type="module" src="./particles.js"></script>
    </body>
</html>
