<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Global Population — 1 Dot = 1M People</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
            rel="stylesheet"
        />
        <style>
            html,
            body {
                font-size: 14px;
                line-height: 16px;
                margin: 0;
                height: 100%;
                /*background: #07090a;*/
                background: linear-gradient(
                    180deg,
                    rgba(242, 242, 242, 1) 0%,
                    rgba(222, 222, 222, 1) 100%
                );

                overflow: hidden;
                font-family: "DM Mono", ui-monospace, monospace;
            }
            .font-sans {
                font-family: "DM Sans", sans-serif;
                font-weight: 400;
                font-style: normal;
            }
            canvas {
                display: block;
            }
            #overlay {
                position: fixed;
                top: 0px;
                left: 0px;
                bottom: 0;
                color: #222;
                max-width: 280px;
                pointer-events: none;
                padding: 16px;
            }
            #overlay h1 {
                margin: 0 0 6px;
                font-size: 1rem;
                font-weight: 500;
                letter-spacing: 0.02em;
            }
            #overlay p {
                margin: 0;
                color: #222;
                font-size: 0.8rem;
                line-height: 1.5;
            }
            #yearControl {
                margin-top: 16px;
                pointer-events: auto;
            }
            #yearControl .year-value {
                color: #222;
                font-size: 3rem;
                font-weight: 500;
                line-height: 1em;
            }
            #yearSlider {
                width: 280px;
                accent-color: #222;
                background: transparent;
            }
            #tooltip {
                position: fixed;
                transform: translate(-50%, -130%);
                /*background: #0d1411;*/
                /*background: #f2f2f2;*/
                /*border: 1px solid #fff;*/
                color: #222;
                padding: 6px 10px;
                font-size: 0.8rem;
                border-radius: 2px;
                pointer-events: none;
                white-space: nowrap;
            }
            #tooltip[hidden] {
                display: none;
            }
            .glass {
                background: rgba(255, 255, 255, 0.1);

                /* The core frosted glass blur effect */
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px); /* Safari support */

                /* Crisp border simulating light catching the edge */
                border: 1px solid rgba(255, 255, 255, 0.25);

                /* Smooth curves and depth shadow */
                /*border-radius: 16px;*/
                /*box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);*/
            }
            .all-caps {
                text-transform: uppercase;
            }
            #metrics {
                margin-top: 18px;
                display: grid;
                pointer-events: none;
            }
            .metric {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 16px;
                border-top: 1px solid rgba(34, 34, 34, 0.12);
                padding: 6px 0;
            }
            .metric-label {
                color: #666;
                font-size: 0.78rem;
                text-transform: uppercase;
                letter-spacing: 0.02em;
            }
            .metric-value {
                color: #222;
                font-size: 0.84rem;
                font-weight: 500;
                white-space: nowrap;
            }
            #colorMode {
                margin-top: 18px;
                display: flex;
                gap: 6px;
                pointer-events: auto;
            }
            #colorMode button {
                font-family: inherit;
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.02em;
                color: #666;
                background: transparent;
                border: 1px solid rgba(34, 34, 34, 0.25);
                border-radius: 999px;
                padding: 4px 12px;
                cursor: pointer;
            }
            #colorMode button.active {
                color: #fff;
                background: #222;
                border-color: #222;
            }
            #legend {
                margin-top: 12px;
                display: grid;
                gap: 6px;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.72rem;
                color: #444;
            }
            .legend-swatch {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex: none;
            }
        </style>
    </head>
    <body>
        <div id="overlay" class="glass">
            <h1 class="all-caps">Global Population</h1>
            <p id="status">Loading population data…</p>
            <div id="yearControl" hidden>
                <div class="year-value">
                    <span id="yearValue" class="font-sans"></span>
                </div>
                <input id="yearSlider" type="range" autocomplete="off" />
            </div>
            <div id="metrics" hidden>
                <div class="metric">
                    <span class="metric-label">Population</span>
                    <span class="metric-value" id="metricPopulation"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">Fertility rate</span>
                    <span class="metric-value" id="metricFertility"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">Life expectancy</span>
                    <span class="metric-value" id="metricLifeExpectancy"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">Median age</span>
                    <span class="metric-value" id="metricMedianAge"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">Population growth</span>
                    <span
                        class="metric-value"
                        id="metricPopulationGrowth"
                    ></span>
                </div>
            </div>
            <div id="colorMode" hidden>
                <button type="button" data-mode="region" class="active">
                    Region
                </button>
                <button type="button" data-mode="income">Income group</button>
            </div>
            <div id="legend"></div>
        </div>
        <div id="tooltip" class="glass" hidden></div>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
                }
            }
        </script>

        <script type="module" src="./particles.js"></script>
    </body>
</html>
