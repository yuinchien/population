name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # --- NEW: show build output so we can confirm what's being uploaded ---
      - name: Show build output
        run: |
          echo "Working directory: $(pwd)"
          echo "Node: $(node -v)  npm: $(npm -v)"
          echo "dist exists: $( [ -d dist ] && echo yes || echo no )"
          echo "Top-level contents of dist:"
          ls -la dist || true
          echo "Files (up to 3 levels):"
          find dist -maxdepth 3 -type f -print || true

      # --- NEW: fail early if no index.html in the artifact root ---
      - name: Validate dist contains index.html
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found. GitHub Pages requires an index.html at the site root."
            echo "Listing dist for debugging:"
            ls -la dist || true
            exit 1
          fi

      # --- NEW: optional CNAME management (only runs if the secret is set) ---
      - name: Add CNAME for custom domain (optional)
        if: ${{ secrets.PAGES_CUSTOM_DOMAIN != '' }}
        run: |
          echo "${{ secrets.PAGES_CUSTOM_DOMAIN }}" > dist/CNAME
        # Set the secret PAGES_CUSTOM_DOMAIN in the repo if you want the Pages site to use a custom domain

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
