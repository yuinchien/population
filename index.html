<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>World Bank Data Explorer</title>
        <meta
            name="description"
            content="A native JavaScript data visualization app powered by the World Bank Open Data API."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="app-shell">
            <section class="control-panel" aria-label="Visualization controls">
                <div class="field">
                    <label for="indicator">Indicator</label>
                    <select id="indicator"></select>
                </div>

                <div class="field year-range-field">
                    <div class="year-range-header">
                        <label>Year range</label>
                        <span class="year-range-value">
                            <span id="startYearLabel"></span> –
                            <span id="endYearLabel"></span>
                        </span>
                    </div>
                    <div class="year-range-slider">
                        <div class="year-range-track">
                            <div
                                class="year-range-fill"
                                id="yearRangeFill"
                            ></div>
                        </div>
                        <input
                            id="startYear"
                            class="range-input range-start"
                            type="range"
                            aria-label="Start year"
                        />
                        <input
                            id="endYear"
                            class="range-input range-end"
                            type="range"
                            aria-label="End year"
                        />
                    </div>
                    <p id="forecastHint" class="forecast-hint"></p>
                </div>

                <div class="mode-toggle" aria-label="Chart mode">
                    <button id="lineMode" type="button">Trend</button>
                    <button id="barMode" class="active" type="button">
                        Latest
                    </button>
                </div>

                <p id="status" class="status" role="status">
                    Loading countries...
                </p>
            </section>

            <section class="viz-panel" aria-label="World Bank visualization">
                <div class="viz-heading">
                    <div>
                        <h2 id="chartTitle">Select a view</h2>
                    </div>
                </div>

                <div class="chart-wrap">
                    <div
                        id="chart3d"
                        class="chart-3d"
                        role="img"
                        aria-labelledby="chartTitle"
                        hidden
                    ></div>
                    <div
                        id="chartLegend"
                        class="chart-legend"
                        aria-label="Chart color legend"
                        hidden
                    ></div>
                    <div id="tooltip" class="tooltip" hidden></div>
                </div>
            </section>
        </main>

        <script type="module" src="/app.js"></script>
    </body>
</html>
