<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-B7JVVPGL92"
        ></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-B7JVVPGL92");
        </script>
        <meta charset="utf-8" />
        <script>
            // Runs before styles.css paints anything, so the correct theme
            // is already on <html> by first paint — doing this later (e.g.
            // in script.js, a deferred module) would flash the default
            // theme first on every load for users who picked the other one.
            (function () {
                var stored = localStorage.getItem("theme");
                var theme =
                    stored ||
                    (matchMedia("(prefers-color-scheme: light)").matches
                        ? "light"
                        : "dark");
                document.documentElement.dataset.theme = theme;
            })();
        </script>
        <link
            rel="icon"
            type="image/png"
            href="https://yuinchien.com/icon_cloud_512.png"
        />

        <meta name="author" content="Yuin Chien" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>World Population</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <button
            id="menuToggle"
            class="menu-toggle glass"
            type="button"
            aria-label="Toggle menu"
            aria-expanded="false"
            title="Menu"
        >
            <span class="menu-toggle-icon"></span>
        </button>
        <div id="menuShim" class="menu-shim"></div>
        <div id="buttonsContainer" class="hide-for-detail hide-for-chart">
            <!--<div class="footer mono-uppercase">
                <a href="https://population.un.org/wpp/" target="_blank"
                    >Data source</a
                >
            </div>-->
            <!--<button
                id="infoButton"
                class="icon-button"
                type="button"
                aria-label="Info"
                title="Info"
            >
                <span class="material-symbols-outlined" aria-hidden="true"
                    >info_i</span
                >
            </button>-->
            <button
                id="themeToggle"
                class="icon-button"
                type="button"
                aria-label="Switch to light theme"
                title="Switch theme"
            >
                <span class="material-symbols-outlined" aria-hidden="true"
                    >light_mode</span
                >
            </button>
            <div id="viewMode" class="button-group" hidden>
                <button
                    type="button"
                    data-mode="cosmos"
                    class="mono-uppercase"
                    aria-label="Cosmos"
                    title="Cosmos"
                >
                    Cosmos
                </button>
                <button
                    type="button"
                    data-mode="globe"
                    class="active mono-uppercase"
                    aria-label="Globe view"
                    title="Globe"
                >
                    Globe
                </button>
                <button
                    type="button"
                    data-mode="map"
                    aria-label="Map view"
                    title="Map"
                    class="mono-uppercase"
                >
                    Map
                </button>
                <button
                    type="button"
                    data-mode="chart"
                    aria-label="Chart view"
                    title="Chart"
                    class="mono-uppercase"
                >
                    Chart
                </button>
            </div>
        </div>

        <section id="cosmosView" class="cosmos-view glass" hidden>
            <div class="cosmos-summary no-scrollbar">
                <p class="cosmos-summary-intro paragraph">
                    A curated set of countries plotted by fertility, life
                    expectancy, and net migration — grouped to show how
                    different regions' demographic trajectories diverge.
                </p>
                <div id="cosmosGroups" class="cosmos-groups"></div>
            </div>
            <div class="cosmos-plot">
                <svg
                    id="cosmosGrid"
                    class="cosmos-grid"
                    preserveAspectRatio="none"
                ></svg>
                <div id="cosmosCards" class="cosmos-cards"></div>
            </div>
        </section>

        <div id="timelineContainer" class="timeline hide-for-chart">
            <button
                id="milestoneTour"
                class="milestone-nav-btn hide-for-chart hide-for-cosmo"
                type="button"
                aria-label="Play milestone tour"
                title="Play tour"
            >
                <span
                    id="milestoneTourIcon"
                    class="material-symbols-outlined"
                    >play_arrow</span
                >
            </button>
            <div class="slider-container">
                <span id="yearValue" class="metric-value"></span>
                <span
                    id="yearHoverValue"
                    class="metric-value year-hover-value"
                    aria-hidden="true"
                    hidden
                ></span>
                <input
                    id="yearSlider"
                    type="range"
                    autocomplete="off"
                    step="1"
                />
            </div>
            <button
                id="milestonePrev"
                class="milestone-nav-btn hide-for-chart hide-for-cosmo"
                type="button"
                aria-label="Previous milestone"
            >
                <span class="material-symbols-outlined"
                    >arrow_back</span
                >
            </button>
            <button
                id="milestoneNext"
                class="milestone-nav-btn hide-for-chart hide-for-cosmo"
                type="button"
                aria-label="Next milestone"
            >
                <span class="material-symbols-outlined"
                    >arrow_forward</span
                >
            </button>
        </div>

        <h1 class="hide-for-detail">
            World Population
        </h1>
        <div class="status-wrapper hide-for-detail hide-for-chart">
            <p id="status" class="paragraph">Loading population data…</p>
        </div>

        <!--<div class="topbar">
            <button
                id="detailBack"
                class="detail-back"
                type="button"
                aria-label="Close detail panel"
                title="Back"
            >
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
        </div>-->

        <div id="overlayMain" class="overlay">
            <div class="legend-wrapper">
                <div id="colorMode" class="tab-group" hidden>
                    <button
                        type="button"
                        data-mode="region"
                        class="active mono-uppercase"
                        aria-label="region"
                        title="Region"
                    >
                        Region
                    </button>
                    <button
                        type="button"
                        data-mode="income"
                        class="mono-uppercase"
                        aria-label="Income group"
                        title="Income group"
                    >
                        Income group
                    </button>
                </div>
                <div id="legend"></div>
            </div>
        </div>

        <div class="milestone-progress">
            <div
                id="milestoneProgressFill"
                class="milestone-progress-fill"
            ></div>
        </div>

        <section id="chartPanel" class="chart-view glass" hidden>
            <div class="topbar">
                <select id="selectChartContent" class="custom-select mono-uppercase">
                    <button>
                        <div>
                            <selectedcontent> </selectedcontent>
                            <svg width="24" height="24" viewBox="0 0 24 24">
                            <path fill="currentColor" d="m7 10l5 5l5-5z"/>
                            </svg>
                        </div>
                    </button>
                    <option value="country" selected="">Country</option>
                    <option value="region">Region</option>
                    <option value="income-group">Income group</option>
                </select>

                <div id="chartCountryPicker" class="chip-input">
                    <button
                        id="chartCountryPickerSummary"
                        class="chip-input-summary"
                        type="button"
                        aria-label="Edit country list"
                    >
                        <span
                            id="chartCountryPickerSummaryFlags"
                            class="chip-input-summary-flags"
                        ></span>
                        <span class="material-symbols-outlined" aria-hidden="true"
                            >add</span
                        >
                    </button>
                    <div id="chartCountryChips" class="chip-input-chips"></div>
                    <input
                        id="chartCountrySearch"
                        class="chip-input-field"
                        type="text"
                        autocomplete="off"
                        placeholder="Add country"
                    />
                    <button
                        id="chartCountryPickerCancel"
                        class="chip-input-cancel"
                        type="button"
                        aria-label="Done editing countries"
                    >
                        <span class="material-symbols-outlined" aria-hidden="true"
                            >close</span
                        >
                    </button>
                    <div
                        id="chartCountrySuggestions"
                        class="chip-suggestions no-scrollbar"
                        hidden
                    ></div>
                </div>
                <select id="chartProjectionScenario" class="custom-select mono-uppercase">
                    <button>
                        <div>
                            <selectedcontent> </selectedcontent>
                            <svg width="24" height="24" viewBox="0 0 24 24">
                            <path fill="currentColor" d="m7 10l5 5l5-5z"/>
                            </svg>
                        </div>
                    </button>
                    <option value="high">High projection</option>
                    <option value="medium" selected>Medium projection</option>
                    <option value="low">Low projection</option>
                </select>
            </div>

            <button id="chartPanelClose" class="btn-return" type="button" aria-label="Close chart view" title="Close">
                <span class="material-symbols-outlined">close</span>
            </button>

            <div class="chart-card">
                <div class="trend-chart-plot">
                    <svg
                        id="trendChart"
                        class="trend-chart"
                        preserveAspectRatio="none"
                    ></svg>
                    <svg
                        id="radarChart"
                        class="trend-chart radar-chart"
                        preserveAspectRatio="none"
                        hidden
                    ></svg>
                </div>
                <div id="chartTable" class="detail-table">
                    <div class="detail-summary chart-insight">
                        <div
                            id="chartInsightCaption"
                            class="caption mono-uppercase"
                        ></div>
                        <p
                            id="chartInsightText"
                            class="country-summary-copy paragraph"
                        ></p>
                    </div>
                    <div
                        id="chartTableHeader"
                        class="detail-row header mono-uppercase"
                    ></div>
                    <div id="chartTableRows" class="detail-rows no-scrollbar"></div>
                </div>
            </div>
            <div id="chartMetricTabs" class="tab-group tall"></div>

        </section>
        <section id="detailPanel" class="detail-panel glass" hidden>
            <div class="detail-panel-header">
                <div class="detail-title-row">
                    <span
                        id="detailFlag"
                        class="country-summary-flag"
                        aria-hidden="true"
                        hidden
                    ></span>
                    <h2 id="detailTitle"></h2>
                    <p id="detailSubtitle"></p>
                </div>
                <button
                    id="detailClose"
                    class="detail-close"
                    type="button"
                    aria-label="Close detail panel"
                    title="Close"
                >
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="detailSummary" class="detail-summary paragraph"></div>
            <div id="detailTable" class="detail-table">
                <div id="detailHeader" class="detail-row header mono-uppercase"></div>
                <div id="detailRows" class="detail-rows no-scrollbar"></div>
            </div>
            <div id="countryDetail" class="country-detail" hidden>
                <div class="country-chart-card">
                    <svg
                        id="countryChart"
                        class="country-chart"
                        viewBox="0 0 760 220"
                        preserveAspectRatio="none"
                    ></svg>
                </div>
                <div id="countrySparklines" class="country-sparklines"></div>
                <div id="countrySimilar" class="country-similar" hidden>
                    <span class="country-similar-label mono-uppercase"
                        >Next to see</span
                    >
                    <div id="countrySimilarList" class="country-similar-list"></div>
                </div>
            </div>
        </section>
        <div id="tooltip" class="glass" hidden></div>
        <div id="chartTooltip" class="glass" hidden></div>
        <div id="calloutLayer"></div>

        <script type="module" src="./script.js"></script>
    </body>
</html>
