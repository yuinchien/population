<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-B7JVVPGL92"
        ></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-B7JVVPGL92");
        </script>
        <meta charset="utf-8" />
        <link
            rel="icon"
            type="image/png"
            href="https://yuinchien.com/icon_cloud_512.png"
        />

        <meta name="author" content="Yuin Chien" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>World Population</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <button
            id="menuToggle"
            class="menu-toggle glass"
            type="button"
            aria-label="Toggle menu"
            aria-expanded="false"
            title="Menu"
        >
            <span class="menu-toggle-icon"></span>
        </button>
        <div id="menuShim" class="menu-shim"></div>
        <div id="viewMode" class="button-group hide-for-detail hide-for-chart" hidden>
            <button
                type="button"
                data-mode="globe"
                class="active mono-uppercase"
                aria-label="Globe view"
                title="Globe"
            >
                Globe
            </button>
            <button
                type="button"
                data-mode="map"
                aria-label="Map view"
                title="Map"
                class="mono-uppercase"
            >
                Map
            </button>
            <button
                type="button"
                data-mode="chart"
                aria-label="Chart view"
                title="Chart"
                class="mono-uppercase"
            >
                Chart
            </button>
        </div>

        <div id="timelineContainer" class="timeline hide-for-chart">
            <button
                id="milestoneTour"
                class="milestone-nav-btn hide-for-chart"
                type="button"
                aria-label="Play milestone tour"
                title="Play tour"
            >
                <span
                    id="milestoneTourIcon"
                    class="material-symbols-outlined"
                    >play_arrow</span
                >
            </button>
            <div class="slider-container">
                <span id="yearValue" class="metric-value"></span>
                <input
                    id="yearSlider"
                    type="range"
                    autocomplete="off"
                    step="1"
                />
            </div>
            <button
                id="milestonePrev"
                class="milestone-nav-btn hide-for-chart"
                type="button"
                aria-label="Previous milestone"
            >
                <span class="material-symbols-outlined"
                    >arrow_back</span
                >
            </button>
            <button
                id="milestoneNext"
                class="milestone-nav-btn hide-for-chart"
                type="button"
                aria-label="Next milestone"
            >
                <span class="material-symbols-outlined"
                    >arrow_forward</span
                >
            </button>
        </div>

        <h1 class="hide-for-detail">
            World Population
        </h1>

        <div class="topbar">
            <button
                id="detailBack"
                class="detail-back"
                type="button"
                aria-label="Close detail panel"
                title="Back"
            >
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
        </div>

        <div class="legend-wrapper">
            <div id="colorMode" class="tab-group" hidden>
                <button
                    type="button"
                    data-mode="region"
                    class="active mono-uppercase"
                    aria-label="region"
                    title="Region"
                >
                    Region
                </button>
                <button
                    type="button"
                    data-mode="income"
                    class="mono-uppercase"
                    aria-label="Income group"
                    title="Income group"
                >
                    Income group
                </button>
            </div>
            <div id="legend"></div>
        </div>

        <div class="milestone-progress">
            <div
                id="milestoneProgressFill"
                class="milestone-progress-fill"
            ></div>
        </div>

        <div class="status-wrapper hide-for-detail hide-for-chart">
            <p id="status">
                <span id="statusTitle" hidden></span>Loading population
                data…
            </p>
        </div>

        <div id="metrics" class="hide-for-detail" hidden>
            <div class="metric">
                <span class="metric-label mono-uppercase">Population</span>
                <span class="metric-value" id="metricPopulation"></span>
            </div>
            <div class="metric">
                <span class="metric-label mono-uppercase">Fertility rate</span>
                <span class="metric-value" id="metricFertility"></span>
            </div>
            <div class="metric">
                <span class="metric-label mono-uppercase">Life expectancy</span>
                <span class="metric-value" id="metricLifeExpectancy"></span>
            </div>
            <div class="metric">
                <span class="metric-label mono-uppercase">Median age</span>
                <span class="metric-value" id="metricMedianAge"></span>
            </div>
            <div class="metric">
                <span class="metric-label mono-uppercase">Population growth</span>
                <span
                    class="metric-value"
                    id="metricPopulationGrowth"
                ></span>
            </div>
        </div>

            <!--<div class="footer mono-uppercase">
                <a href="https://population.un.org/wpp/" target="_blank"
                    >Data source</a
                >
            </div>-->

        <div id="yearTimeline" class="year-timeline" hidden></div>
        <section id="chartView" class="chart-view glass" hidden>

            <div class="detail-panel-header">
                <div id="chartCountryPicker" class="chip-input">
                    <div id="chartCountryChips" class="chip-input-chips"></div>
                    <input
                        id="chartCountrySearch"
                        class="chip-input-field"
                        type="text"
                        autocomplete="off"
                        placeholder="Add country"
                    />
                    <div
                        id="chartCountrySuggestions"
                        class="chip-suggestions no-scrollbar"
                        hidden
                    ></div>
                </div>
                <button id="chartViewClose" class="detail-close" type="button" aria-label="Close chart view" title="Close">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="chart-content">
                <div class="chart-card">
                    <div id="chartMetricTabs" class="button-list"></div>
                    <svg
                        id="trendChart"
                        class="trend-chart"
                        preserveAspectRatio="none"
                    ></svg>
                </div>

                <div id="chartTable" class="detail-table">
                    <div
                        id="chartTableHeader"
                        class="detail-row header mono-uppercase"
                    ></div>
                    <div id="chartTableRows" class="detail-rows no-scrollbar"></div>
                </div>
            </div>

        </section>
        <section id="detailPanel" class="detail-panel glass" hidden>
            <div class="detail-panel-header">
                <div class="detail-title-row">
                    <h2 id="detailTitle" class="mono-uppercase"></h2>
                    <p id="detailSubtitle" class="mono-uppercase"></p>
                </div>
                <button
                    id="detailClose"
                    class="detail-close"
                    type="button"
                    aria-label="Close detail panel"
                    title="Close"
                >
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <p id="detailSummary" class="detail-summary"></p>
            <div id="detailTable" class="detail-table">
                <div id="detailHeader" class="detail-row header mono-uppercase"></div>
                <div id="detailRows" class="detail-rows no-scrollbar"></div>
            </div>
            <div id="countryDetail" class="country-detail" hidden>
                <div class="country-chart-card">
                    <svg
                        id="countryChart"
                        class="country-chart"
                        viewBox="0 0 760 220"
                        preserveAspectRatio="none"
                    ></svg>
                </div>
                <div id="countrySparklines" class="country-sparklines"></div>
            </div>
        </section>
        <div id="tooltip" class="glass" hidden></div>
        <div id="chartTooltip" class="glass" hidden></div>
        <div id="calloutLayer"></div>

        <script type="module" src="./script.js"></script>
    </body>
</html>
