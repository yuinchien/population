<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Global Population</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>
        <div id="overlay" class="glass">
            <div class="topbar">
                <h1>
                    Global Population
                    <span id="titleYear" class="title-year"></span>
                </h1>
            </div>
            <hr />
            <div id="viewMode" class="tab-group full-width" hidden>
                <button
                    type="button"
                    data-mode="globe"
                    class="active"
                    aria-label="Globe view"
                    title="Globe"
                >
                    Globe
                </button>
                <button
                    type="button"
                    data-mode="map"
                    aria-label="Map view"
                    title="Map"
                >
                    Map
                </button>
            </div>

            <div id="yearControl" hidden>
                <div class="metric">
                    <span class="metric-label">Year</span>
                    <span id="yearValue" class="metric-value"></span>
                </div>
                <input
                    id="yearSlider"
                    type="range"
                    autocomplete="off"
                    step="1"
                />
            </div>
            <div id="metrics" hidden>
                <div class="metric">
                    <span class="metric-label">Population</span>
                    <span class="metric-value" id="metricPopulation"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">Fertility rate</span>
                    <span class="metric-value" id="metricFertility"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">Life expectancy</span>
                    <span class="metric-value" id="metricLifeExpectancy"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">Median age</span>
                    <span class="metric-value" id="metricMedianAge"></span>
                </div>
                <div class="metric">
                    <span class="metric-label">Population growth</span>
                    <span
                        class="metric-value"
                        id="metricPopulationGrowth"
                    ></span>
                </div>
            </div>
            <div>
                <div id="colorMode" class="tab-group" hidden>
                    <button
                        type="button"
                        data-mode="region"
                        class="active"
                        aria-label="region"
                        title="Region"
                    >
                        Region
                    </button>
                    <button
                        type="button"
                        data-mode="income"
                        aria-label="Income group"
                        title="Income group"
                    >
                        Income group
                    </button>
                </div>

                <div id="legend"></div>
            </div>
            <hr />
            <div>
                <p id="status">Loading population data…</p>
                <!--<a href="https://population.un.org/wpp/">Data source</a>-->
            </div>
        </div>
        <section id="detailPanel" class="detail-panel glass" hidden>
            <div class="detail-panel-header">
                <div>
                    <h2 id="detailTitle"></h2>
                    <p id="detailSubtitle"></p>
                </div>
                <button
                    id="detailClose"
                    class="detail-close"
                    type="button"
                    aria-label="Close detail panel"
                    title="Close"
                >
                    ×
                </button>
            </div>
            <div id="detailRows" class="detail-rows"></div>
        </section>
        <div id="tooltip" class="glass" hidden></div>
        <div id="calloutLayer"></div>

        <script type="module" src="./script.js"></script>
    </body>
</html>
