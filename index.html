<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Global Population Trends — World Bank Explorer</title>
        <meta
            name="description"
            content="Global population, growth rate, life expectancy, fertility rate, and median age over time (1950-2100), sourced from the UN World Population Prospects 2024 dataset."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main class="app-shell">
            <section class="control-panel" aria-label="Population controls">
                <div class="title">
                    World Population Prospects
                    <!--<a
                        href="https://population.un.org/wpp/downloads?folder=Standard%20Projections&group=Most%20used"
                        >World Population Prospects
                    </a>-->
                </div>

                <div class="field">
                    <label for="seriesSelect">Indicators</label>
                    <select id="seriesSelect" multiple size="6"></select>
                </div>

                <div class="field year-range-field">
                    <div class="year-range-header">
                        <label>Year range</label>
                        <span class="year-range-value">
                            <span id="startYearLabel"></span> –
                            <span id="endYearLabel"></span>
                        </span>
                    </div>
                    <div class="year-range-slider">
                        <div class="year-range-track">
                            <div
                                class="year-range-fill"
                                id="yearRangeFill"
                            ></div>
                        </div>
                        <input
                            id="startYear"
                            class="range-input range-start"
                            type="range"
                            aria-label="Start year"
                        />
                        <input
                            id="endYear"
                            class="range-input range-end"
                            type="range"
                            aria-label="End year"
                        />
                    </div>
                </div>

                <p id="status" class="status" role="status">
                    Loading population data...
                </p>
            </section>

            <section class="viz-panel" aria-label="Global population trends">
                <div class="viz-heading">
                    <div>
                        <h2 id="chartTitle">Global Population Trends</h2>
                        <p id="chartSubtitle" class="chart-subtitle"></p>
                    </div>
                </div>

                <div class="chart-wrap">
                    <div id="chart3d" class="chart-3d"></div>
                    <div
                        id="chartLegend"
                        class="chart-legend"
                        aria-label="Series legend"
                        hidden
                    ></div>
                    <div id="tooltip" class="tooltip" hidden></div>
                </div>
            </section>
        </main>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
                }
            }
        </script>
        <script type="module" src="./script.js"></script>
    </body>
</html>
