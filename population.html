<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Global Population Trends — World Bank Explorer</title>
        <meta
            name="description"
            content="Global population, life expectancy, and fertility rate over time (1960-2050), sourced from the World Bank Population Estimates and Projections dataset."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="population.css" />
    </head>
    <body>
        <main class="app-shell">
            <section class="control-panel" aria-label="Population controls">
                <div class="field year-range-field">
                    <div class="year-range-header">
                        <label>Year range</label>
                        <span class="year-range-value">
                            <span id="startYearLabel"></span> –
                            <span id="endYearLabel"></span>
                        </span>
                    </div>
                    <div class="year-range-slider">
                        <div class="year-range-track">
                            <div
                                class="year-range-fill"
                                id="yearRangeFill"
                            ></div>
                        </div>
                        <input
                            id="startYear"
                            class="range-input range-start"
                            type="range"
                            aria-label="Start year"
                        />
                        <input
                            id="endYear"
                            class="range-input range-end"
                            type="range"
                            aria-label="End year"
                        />
                    </div>
                    <p id="forecastHint" class="forecast-hint">
                        Years after 2024 are World Bank projection
                        checkpoints (5-year intervals).
                    </p>
                </div>

                <p id="status" class="status" role="status">
                    Loading population data...
                </p>

                <a href="/index.html" class="page-nav-link"
                    >&larr; Indicator explorer</a
                >
            </section>

            <section class="viz-panel" aria-label="Global population trends">
                <div class="viz-heading">
                    <div>
                        <h2 id="chartTitle">
                            Global Population, Life Expectancy &amp;
                            Fertility
                        </h2>
                        <p id="chartSubtitle" class="chart-subtitle"></p>
                    </div>
                </div>

                <div class="chart-wrap">
                    <div id="chart3d" class="chart-3d"></div>
                    <div
                        id="chartLegend"
                        class="chart-legend"
                        aria-label="Series legend"
                        hidden
                    ></div>
                    <div id="tooltip" class="tooltip" hidden></div>
                </div>
            </section>
        </main>

        <script type="module" src="/population.js"></script>
    </body>
</html>
