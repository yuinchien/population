<html>
    <head>
        <meta charset="utf-8" />
        <title>Cosmo</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background: #f2f2f2;
                font-family: ui-monospace, monospace;
                font-size: 14px;
            }
            #canvas {
                width: 100%;
                height: 100%;
                position: relative;
            }
            .flag {
                position: absolute;
                width: 36;
                height: 27px;
                background-size: cover;
                background-position: center;
                border-radius: 2px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
                font-size: 0;
            }
            .isometric-floor {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate3d(-50%,-50%,0);
                width: 800px;
                height: 400px;
                z-index: -1;
                background-color: #ccc;
                border: 1px solid rgba(0,0,0,.1);
              /* Rotates the plane 45 degrees, then squashes it vertically */
                transform: rotateX(60deg) rotateZ(45deg);
                transform-style: preserve-3d;
            }
            .isometric {
                transform: rotateX(60deg) rotateZ(45deg);
                transform-style: preserve-3d;
            }
        </style>
    </head>
    <body>

        <div class="isometric-floor"></div>

        <div id="canvas"></div>

        <!--<div class="country-card" style="transform: translate3d(240px, 120px, 0);">
          <div class="flag"></div>
          <span class="label">Canada</span>
        </div>-->

        <script type="module">
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const canvas = document.getElementById("canvas");
          let countries = await fetch("./data/country.json").then((r) =>
              r.json(),
          );
          console.log(countries);

          const cos30 = Math.cos(Math.PI / 6); // ~0.866
          const sin30 = Math.sin(Math.PI / 6); // ~0.500

          function projectToIsometric(x, y, z) {
            const screenX = (x - y) * cos30;
            // Note: subtraction of Z moves the element "up" on the screen
            const screenY = (x + y) * sin30 - z;
            return { x: screenX, y: screenY };
          }

          const total = 100;

          const sortedCountries = countries.map(country => {
            const coords = projectToIsometric(Math.random(), Math.random(), Math.random());
            return { ...country, ...coords };
          }).sort((a, b) => {

            // In isometric projection, elements with higher (X + Y) values
            // are closer to the screen (foreground)
            return (a.x + a.y) - (b.x + b.y);
          });


          for(let i=0; i<sortedCountries.length; i++) {
            const newDiv = document.createElement('div');
            newDiv.textContent = sortedCountries[i].name;
            newDiv.classList.add('flag', 'isometric');
            newDiv.style.backgroundImage = `url(${sortedCountries[i].flag_4x3})`;
            const pos = projectToIsometric(Math.random(), Math.random(), Math.random());
            newDiv.style.left = sortedCountries[i].x * vw;
            newDiv.style.top = sortedCountries[i].y * vh;
            canvas.appendChild(newDiv);
          }

        </script>
    </body>
</html>
